<!DOCTYPE html>
<!-- Abhisekh ka vatsavik tracker. Open source under the MIT License (see LICENSE). -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhisekh ka vatsavik tracker</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mu:#6b756e;--ac:#2f8f5b;--bd:#e3e7e1;--p:#3b82f6;--c:#f59e0b;--f:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111512;--card:#1a201c;--tx:#e8eee9;--mu:#98a39b;--ac:#4cc283;--bd:#2a332d}}
:root[data-theme="dark"]{--bg:#111512;--card:#1a201c;--tx:#e8eee9;--mu:#98a39b;--ac:#4cc283;--bd:#2a332d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.date{justify-content:space-between;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;border-radius:6px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:400px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;font-size:12px}tfoot td{font-weight:700}.x{padding:2px 8px}
.fr{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.stat{flex:1;min-width:90px;text-align:center}.stat b{font-size:20px;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:9px 2px;font-size:11px;color:var(--mu)}
.tabs button span{display:block;font-size:18px}.tabs button.on{color:var(--ac);font-weight:700}
#ts{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
svg text{font-family:inherit}
@media(max-width:480px){.g{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<h1>🥗 Abhisekh ka vatsavik tracker</h1>
<div class="sub">Calories, macros, water &amp; weight. Free, any device, data stays in your browser.</div>
<div id="v"></div>
<div class="mu" style="text-align:center;margin-top:16px">Open source · MIT License · Estimates only, not medical advice</div></main>
<nav class="tabs" id="tb"></nav><div id="ts"></div>
<script>
const $=id=>document.getElementById(id);
let S={goals:{k:2000,p:170,c:200,f:55},days:{},weights:{},custom:[],theme:'auto',pf:{sx:'m',ag:23,wt:85,ht:175,ac:'1.375',gl:'-500'}};
try{const r=localStorage.getItem('vt1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
for(const d in S.days)if(Array.isArray(S.days[d]))S.days[d]={log:S.days[d],water:0};
const save=()=>{try{localStorage.setItem('vt1',JSON.stringify(S))}catch(e){}};
const iso=d=>d.toLocaleDateString('en-CA'),R=n=>Math.round(n),TODAY=iso(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur=TODAY,tab='today';
const rd=d=>S.days[d]||{log:[],water:0},wr=()=>S.days[cur]=S.days[cur]||{log:[],water:0};
const tot=l=>l.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0});
const shiftD=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
function toast(m){const t=$('ts');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1400)}
const autoMeal=()=>{const h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<19?'Snack':'Dinner'};
const MEALS=['Breakfast','Lunch','Snack','Dinner'];
const mealOpts=s=>MEALS.map(m=>`<option${m==s?' selected':''}>${m}</option>`).join('');
const DB=[["Roti / chapati","1 piece",104,3,18,3],["Rice, cooked","1 cup",205,4,45,0.4],["Dal","1 katori",150,9,20,4],["Paneer","100 g",265,18,1,21],["Egg, boiled","1 egg",78,6,0.6,5],["Chicken breast, cooked","100 g",165,31,0,3.6],["Chicken curry","1 katori",200,20,6,11],["Curd / dahi","1 bowl",90,5,7,5],["Milk","1 glass",150,8,12,8],["Banana","1 medium",105,1.3,27,0.4],["Apple","1 medium",95,0.5,25,0.3],["Oats, dry","40 g",150,5,27,3],["Idli","1 piece",58,2,12,0.4],["Dosa, plain","1 piece",133,3,22,3.7],["Sambar","1 katori",80,4,12,2],["Poha","1 plate",250,5,45,6],["Upma","1 plate",230,5,38,7],["Chole","1 katori",210,10,30,6],["Rajma","1 katori",190,10,30,3],["Mixed veg sabzi","1 katori",120,3,12,7],["Whey protein","1 scoop",120,24,3,1.5],["Peanuts","30 g",170,7,5,14],["Almonds","10 pcs",70,2.5,2.5,6],["Peanut butter","1 tbsp",95,4,3,8],["Soya chunks, dry","50 g",172,26,16,0.5],["Sweet potato","100 g",86,1.6,20,0.1],["Chicken biryani","1 plate",450,22,55,15],["Samosa","1 piece",260,4,24,17],["Bread slice","1 slice",80,3,15,1],["Tea with milk &amp; sugar","1 cup",60,1.5,9,2],["Ghee","1 tsp",45,0,0,5]].map(a=>({n:a[0].replace('&amp;','&'),s:a[1],k:a[2],p:a[3],c:a[4],f:a[5]}));
const ALL=()=>DB.concat(S.custom);
function bar(l,v,g,col){return `<div class="row" style="justify-content:space-between"><span>${l}</span><span class="mu">${R(v)} / ${R(g)} g</span></div><div class="bar"><i style="width:${Math.min(100,g?v/g*100:0)}%;background:${col}"></i></div>`}
function pushEntry(n,m,k,p,c,f){wr().log.push({id:Date.now()+Math.random(),n,m,k,p,c,f});save()}

/* ---------- views ---------- */
function drawTabs(){$('tb').innerHTML=[['today','📅','Today'],['foods','🍛','Foods'],['prog','📊','Progress'],['wt','⚖️','Weight'],['set','⚙️','Settings']].map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab==t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('')}
function go(t){tab=t;drawTabs();window.scrollTo(0,0);({today:vToday,foods:vFoods,prog:vProg,wt:vWt,set:vSet})[t]()}
function vToday(){$('v').innerHTML=`<div class="row date"><button data-a="day" data-v="-1">‹</button><input type="date" id="dt" style="width:auto"><button data-a="day" data-v="1">›</button></div>
<div id="sum" class="card"></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>💧 Water</b><span id="wl" class="mu"></span></div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><button data-a="w" data-v="-1">−</button><div id="wg" style="flex:1;font-size:20px;letter-spacing:2px;text-align:center"></div><button class="pri" data-a="w" data-v="1">+ Glass</button></div></div>
<div class="card"><b>Add food</b>
<div class="row" style="margin:8px 0"><input id="n" placeholder="Food name (e.g. 2 eggs)" style="flex:2;min-width:150px"><select id="m" style="flex:1;min-width:110px">${mealOpts(autoMeal())}</select></div>
<div class="g"><div><label>Calories</label><input id="k" type="number" min="0" inputmode="decimal" placeholder="auto"></div><div><label>Protein g</label><input id="p" type="number" min="0" inputmode="decimal"></div><div><label>Carbs g</label><input id="c" type="number" min="0" inputmode="decimal"></div><div><label>Fats g</label><input id="f" type="number" min="0" inputmode="decimal"></div></div>
<label style="margin:8px 0"><input type="checkbox" id="sv" style="width:auto"> Save as my food (for the Foods tab)</label>
<button class="pri" data-a="add" style="width:100%">Add</button></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>Log</b><button data-a="cy">Copy yesterday</button></div><div class="tw" id="log" style="margin-top:6px"></div></div>`;updT()}
function updT(){const d=rd(cur),L=d.log,T=tot(L),G=S.goals,rem=G.k-T.k,pc=Math.min(1,T.k/G.k),col=rem>=0?'var(--ac)':'var(--f)';
$('dt').value=cur;
$('sum').innerHTML=`<div class="row" style="flex-wrap:nowrap;gap:14px"><svg viewBox="0 0 120 120" width="112" style="flex:none"><circle cx="60" cy="60" r="52" fill="none" style="stroke:var(--bd)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" style="stroke:${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${pc*326.7} 327" transform="rotate(-90 60 60)"/><text x="60" y="60" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--tx)">${R(Math.abs(rem))}</text><text x="60" y="78" text-anchor="middle" font-size="10" style="fill:var(--mu)">${rem>=0?'kcal left':'kcal over'}</text></svg><div style="flex:1">${bar('Protein',T.p,G.p,'var(--p)')}${bar('Carbs',T.c,G.c,'var(--c)')}${bar('Fats',T.f,G.f,'var(--f)')}<div class="mu">Eaten ${R(T.k)} of ${R(G.k)} kcal</div></div></div>`;
$('wl').textContent=`${d.water} glasses · ${d.water*250} ml`;
$('wg').textContent='💧'.repeat(Math.min(d.water,12))||'–';
$('log').innerHTML=L.length?`<table><thead><tr><th>Item</th><th>kcal</th><th>P</th><th>C</th><th>F</th><th></th></tr></thead><tbody>${L.map(e=>`<tr><td>${esc(e.n)}<div class="mu">${e.m}</div></td><td>${R(e.k)}</td><td>${R(e.p)}</td><td>${R(e.c)}</td><td>${R(e.f)}</td><td><button class="x" data-a="del" data-v="${e.id}">✕</button></td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${R(T.k)}</td><td>${R(T.p)}</td><td>${R(T.c)}</td><td>${R(T.f)}</td><td></td></tr><tr class="mu"><td>Goal</td><td>${R(G.k)}</td><td>${R(G.p)}</td><td>${R(G.c)}</td><td>${R(G.f)}</td><td></td></tr></tfoot></table>`:'<div class="mu">Nothing logged yet.</div>'}
function vFoods(){$('v').innerHTML=`<div class="card"><div class="row"><input id="fs" placeholder="Search foods…" style="flex:2;min-width:150px"><select id="fm" style="flex:1;min-width:110px">${mealOpts(autoMeal())}</select></div><div class="mu" style="margin-top:6px">Adds to ${cur===TODAY?'today':cur}. Values are approximate per serving. Quantity multiplies the serving.</div><div id="fl"></div></div>`;fl()}
function fl(){const q=($('fs').value||'').toLowerCase(),a=ALL();let h='';a.forEach((f,i)=>{if(q&&!f.n.toLowerCase().includes(q))return;h+=`<div class="fr"><div style="flex:1"><b>${esc(f.n)}</b>${i>=DB.length?' ⭐':''}<div class="mu">${esc(f.s)} · ${R(f.k)} kcal · P${f.p} C${f.c} F${f.f}</div></div><input id="q${i}" type="number" value="1" step="0.5" min="0.25" style="width:62px"><button class="pri" data-a="af" data-v="${i}">+</button>${i>=DB.length?`<button class="x" data-a="dcf" data-v="${i-DB.length}">✕</button>`:''}</div>`});$('fl').innerHTML=h||'<div class="mu" style="margin-top:8px">No match. Add it from the Today tab and tick “Save as my food”.</div>'}
function vProg(){const G=S.goals,days=[];for(let i=13;i>=0;i--){const d=shiftD(TODAY,-i);days.push({d,t:tot(rd(d).log),n:rd(d).log.length})}
const W=320,H=130,mx=Math.max(G.k*1.3,...days.map(x=>x.t.k)),bw=W/14;
const bars=days.map((x,i)=>{const h=x.t.k/mx*H;return `<rect x="${i*bw+3}" y="${H-h}" width="${bw-6}" height="${h}" rx="3" style="fill:${x.t.k>G.k*1.05?'var(--f)':'var(--ac)'}"/><text x="${i*bw+bw/2}" y="${H+13}" text-anchor="middle" font-size="9" style="fill:var(--mu)">${+x.d.slice(8)}</text>`}).join('');
const gy=H-G.k/mx*H,l7=days.slice(7).filter(x=>x.n),av=k=>l7.length?R(l7.reduce((a,x)=>a+x.t[k],0)/l7.length):0;
let st=0,i=rd(TODAY).log.length?0:1;while(rd(shiftD(TODAY,-i)).log.length){st++;i++}
const wc=Object.keys(S.days).reduce((a,d)=>a+(rd(d).log.length?1:0),0);
$('v').innerHTML=`<div class="card"><b>Calories, last 14 days</b><svg viewBox="0 0 ${W} ${H+18}" width="100%" style="margin-top:8px">${bars}<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke-dasharray="4 3" style="stroke:var(--mu)"/></svg><div class="mu">Dashed line = your goal (${R(G.k)} kcal). Red = over goal.</div></div>
<div class="card"><b>7-day average (days logged)</b><div class="row" style="margin-top:8px"><div class="stat"><b>${av('k')}</b><span class="mu">kcal</span></div><div class="stat"><b style="color:var(--p)">${av('p')}</b><span class="mu">protein g</span></div><div class="stat"><b style="color:var(--c)">${av('c')}</b><span class="mu">carbs g</span></div><div class="stat"><b style="color:var(--f)">${av('f')}</b><span class="mu">fats g</span></div></div></div>
<div class="card"><div class="row"><div class="stat"><b>🔥 ${st}</b><span class="mu">day streak</span></div><div class="stat"><b>${wc}</b><span class="mu">days logged</span></div><div class="stat"><b>${rd(TODAY).water}</b><span class="mu">glasses today</span></div></div></div>`}
function vWt(){const ks=Object.keys(S.weights).sort(),pts=ks.slice(-30).map(d=>({d,w:S.weights[d]}));let ch='<div class="mu">Log your weight to see the trend.</div>';
if(pts.length>1){const W=320,H=120,mn=Math.min(...pts.map(p=>p.w))-1,mx=Math.max(...pts.map(p=>p.w))+1,X=i=>10+i*(W-20)/(pts.length-1),Y=w=>H-(w-mn)/(mx-mn)*H;
ch=`<svg viewBox="0 0 ${W} ${H+16}" width="100%"><polyline fill="none" stroke-width="2.5" style="stroke:var(--ac)" points="${pts.map((p,i)=>X(i)+','+Y(p.w)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.w)}" r="3" style="fill:var(--ac)"/>`).join('')}<text x="10" y="${H+13}" font-size="10" style="fill:var(--mu)">${pts[0].d.slice(5)} · ${pts[0].w}kg</text><text x="${W-10}" y="${H+13}" text-anchor="end" font-size="10" style="fill:var(--mu)">${pts.at(-1).d.slice(5)} · ${pts.at(-1).w}kg</text></svg>`}
const ch2=ks.length>1?(S.weights[ks.at(-1)]-S.weights[ks[0]]):0;
$('v').innerHTML=`<div class="card"><b>Log weight</b><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="wd" type="date" value="${TODAY}"><input id="wv" type="number" step="0.1" inputmode="decimal" placeholder="kg"><button class="pri" data-a="aw">Save</button></div></div>
<div class="card">${ks.length?`<div class="row" style="margin-bottom:8px"><div class="stat"><b>${S.weights[ks[0]]}</b><span class="mu">start kg</span></div><div class="stat"><b>${S.weights[ks.at(-1)]}</b><span class="mu">latest kg</span></div><div class="stat"><b style="color:${ch2<=0?'var(--ac)':'var(--f)'}">${ch2>0?'+':''}${ch2.toFixed(1)}</b><span class="mu">change kg</span></div></div>`:''}${ch}</div>
<div class="card"><b>History</b>${ks.slice(-10).reverse().map(d=>`<div class="fr"><span style="flex:1">${d}</span><b>${S.weights[d]} kg</b><button class="x" data-a="dw" data-v="${d}">✕</button></div>`).join('')||'<div class="mu">No entries.</div>'}</div>`}
function vSet(){const p=S.pf,G=S.goals,o=(v,l,s)=>`<option value="${v}"${s==v?' selected':''}>${l}</option>`;
$('v').innerHTML=`<div class="card"><b>Goal calculator</b><div class="g2" style="margin:10px 0">
<div><label>Sex</label><select id="sx">${o('m','Male',p.sx)}${o('f','Female',p.sx)}</select></div><div><label>Age</label><input id="ag" type="number" value="${p.ag}"></div><div><label>Weight kg</label><input id="wt" type="number" value="${p.wt}"></div><div><label>Height cm</label><input id="ht" type="number" value="${p.ht}"></div>
<div><label>Activity</label><select id="ac">${o('1.2','Sedentary',p.ac)}${o('1.375','Light (3-4 workouts)',p.ac)}${o('1.55','Moderate',p.ac)}${o('1.725','Very active',p.ac)}</select></div><div><label>Goal</label><select id="gl">${o('-500','Fat loss (-500)',p.gl)}${o('0','Maintain',p.gl)}${o('300','Muscle gain (+300)',p.gl)}</select></div></div>
<button class="pri" data-a="calc" style="width:100%">Calculate &amp; set goals</button><div class="mu" id="cres" style="margin-top:8px"></div></div>
<div class="card"><b>Daily goals (manual)</b><div class="g" style="margin:8px 0"><div><label>Calories</label><input id="gk" type="number" value="${R(G.k)}"></div><div><label>Protein g</label><input id="gp" type="number" value="${R(G.p)}"></div><div><label>Carbs g</label><input id="gc" type="number" value="${R(G.c)}"></div><div><label>Fats g</label><input id="gf" type="number" value="${R(G.f)}"></div></div><button data-a="sg" style="width:100%">Save goals</button></div>
<div class="card"><b>Theme</b><select id="th" style="margin-top:8px">${o('auto','Auto (device)',S.theme)}${o('light','Light',S.theme)}${o('dark','Dark',S.theme)}</select></div>
<div class="card"><b>Backup &amp; restore</b><div class="mu" style="margin:4px 0 8px">Copy the text to keep a backup, or paste a backup and restore (e.g. on another device).</div><textarea id="bk" rows="4" placeholder="Backup text"></textarea><div class="row" style="margin-top:8px"><button data-a="bk">Show backup</button><button data-a="rs">Restore</button><button data-a="rst" style="color:var(--f)">Reset all</button></div></div>`}

/* ---------- actions ---------- */
function applyTheme(){if(S.theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.theme}
const A={
tab:v=>go(v),
day:v=>{cur=shiftD(cur,+v);updT()},
w:v=>{const d=wr();d.water=Math.max(0,d.water+ +v);save();updT()},
add:()=>{const n=$('n').value.trim(),p=+$('p').value||0,c=+$('c').value||0,f=+$('f').value||0,k=$('k').value===''?p*4+c*4+f*9:+$('k').value;
if(!n||!(k||p||c||f)){$('n').focus();return toast('Enter a name and some values')}
pushEntry(n,$('m').value,k,p,c,f);if($('sv').checked)S.custom.push({n,s:'1 serving',k,p,c,f});save();vToday();toast('Added')},
del:v=>{const d=wr();d.log=d.log.filter(e=>e.id!=v);save();updT()},
cy:()=>{const y=rd(shiftD(cur,-1)).log;if(!y.length)return toast('Nothing yesterday');y.forEach(e=>pushEntry(e.n,e.m,e.k,e.p,e.c,e.f));updT();toast('Copied')},
af:v=>{const f=ALL()[v],q=+$('q'+v).value||1;pushEntry(f.n+(q!=1?` ×${q}`:''),$('fm').value,f.k*q,f.p*q,f.c*q,f.f*q);toast(`Added ${f.n}`)},
dcf:v=>{S.custom.splice(+v,1);save();fl()},
aw:()=>{const w=+$('wv').value,d=$('wd').value;if(!w||!d)return toast('Enter date and weight');S.weights[d]=w;save();vWt()},
dw:v=>{delete S.weights[v];save();vWt()},
calc:()=>{const p=S.pf={sx:$('sx').value,ag:+$('ag').value,wt:+$('wt').value,ht:+$('ht').value,ac:$('ac').value,gl:$('gl').value};
const bmr=10*p.wt+6.25*p.ht-5*p.ag+(p.sx=='m'?5:-161),td=bmr*p.ac,k=td+ +p.gl,pr=2*p.wt,f=k*.25/9,c=Math.max(0,(k-pr*4-f*9)/4);
S.goals={k,p:pr,c,f};save();vSet();$('cres').textContent=`BMR ${R(bmr)} · Maintenance ${R(td)} · Target ${R(k)} kcal (P ${R(pr)}g, C ${R(c)}g, F ${R(f)}g). Goals saved.`},
